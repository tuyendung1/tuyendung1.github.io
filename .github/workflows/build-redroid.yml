name: Build Redroid Auto-IMEI

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Nhập đúng định dạng: 11.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Tải mã nguồn của bro (chứa 2 file init.vphone.sh và vphone.rc ở thư mục gốc)
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2. Clone công cụ redroid-script uy tín từ cộng đồng để vá Magisk
      - name: Fetch Redroid Script Tools
        run: |
          sudo apt-get update && sudo apt-get install -y lzip
          git clone https://github.com/ayasa520/redroid-script.git builder
          

      # 3. Cài đặt trực tiếp thư viện Python bằng pip hệ thống
      - name: Install Python Dependencies Locally
        run: |
          sudo pip3 install requests tqdm

      # 4. Chạy script để tự động tải bản Redroid gốc từ Docker Hub và tự động vá Magisk
      - name: Extract and Patch Magisk
        run: |
          cd builder
          python3 redroid.py -a ${{ github.event.inputs.android_version }} -g

      # 5. Xử lý phân quyền file an toàn từ máy chủ ảo GitHub Actions (SỬA TRIỆT ĐỂ LỖI 255)
      - name: Prepare Workspace and Fix Permissions Outside Docker
        run: |
          mkdir -p workspace
          cp init.vphone.sh ./workspace/
          cp vphone.rc ./workspace/
          
          # Thực hiện gán quyền thực thi cho script ngay trên Linux của GitHub Actions.
          # Khi sao chép vào Docker, file sẽ giữ nguyên quyền này mà không cần chạy lệnh RUN chmod.
          chmod 0755 ./workspace/init.vphone.sh

      # 6. Tạo file Dockerfile SẠCH - KHÔNG CHỨA LỆNH RUN CHMOD GÂY LỖI
      - name: Generate Custom Dockerfile
        run: |
          cat <<EOF > ./workspace/Dockerfile
          # Sử dụng Image gốc đã có Magisk nằm ngay trong bộ nhớ đệm Local của máy ảo
          FROM redroid/redroid:${{ github.event.inputs.android_version }}_magiskg

          # Nhúng tập lệnh tự sinh IMEI/PIN vào phân vùng Vendor
          COPY init.vphone.sh /vendor/bin/init.vphone.sh
          COPY vphone.rc /vendor/etc/init/vphone.rc
          EOF

      # 7. Đăng nhập tự động vào hệ thống lưu trữ GitHub Packages (GHCR) của bro
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Tiến hành đóng gói đè lớp bằng lệnh Docker truyền thống và đẩy thẳng lên mạng
      - name: Compile and Push Custom Redroid Image
        run: |
          # Ép tên tài khoản viết thường để tránh lỗi hệ thống Registry
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_TAG="ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}"
          
          cd workspace
          
          # Đóng gói nhẹ nhàng đè file cấu hình lên lớp đĩa có sẵn Magisk
          docker build -t "$TARGET_TAG" -f Dockerfile .
          
          # Đẩy Image hoàn chỉnh lên kệ Packages của bro
          docker push "$TARGET_TAG"
          
