name: Build and Push Redroid Image

# Kích hoạt khi bạn nhấn nút thủ công trên GitHub (Workflow Dispatch)
on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Ví dụ: 11.0.0, 12.0.0, 13.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Kiểm tra mã nguồn kho lưu trữ
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Thiết lập Docker Buildx để tối ưu quá trình build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 3. Đăng nhập vào hệ thống lưu trữ Image của GitHub (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
             # 4. Tải công cụ nhúng Magisk và chèn cấu hình IMEI/PIN vào Dockerfile
      - name: Setup Redroid Magisk and Custom Props
        run: |
          git clone https://github.com builder
          cd builder
          
          # Sao chép các file cấu hình IMEI/PIN từ Repo ngoài vào thư mục build
          cp ../init.vphone.sh ./
          cp ../vphone.rc ./

          # Chèn trực tiếp lệnh COPY và cấu hình vào cuối Dockerfile gốc
          echo "" >> Dockerfile
          echo "COPY init.vphone.sh /system/bin/init.vphone.sh" >> Dockerfile
          echo "COPY vphone.rc /vendor/etc/init/vphone.rc" >> Dockerfile
          echo "USER root" >> Dockerfile
          echo "RUN chmod 0755 /system/bin/init.vphone.sh" >> Dockerfile

      # 5. Chạy lệnh Build trực tiếp bằng Buildx (Bỏ qua file build.sh lỗi thời)
      - name: Build and Push Custom Redroid Image
        run: |
          cd builder
          
          # Chuyển tên Username thành chữ thường để tránh lỗi Docker Registry
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # Thực hiện tải Redroid gốc về làm nền, gộp Magisk và đóng gói đẩy lên GHCR
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "IMAGE=redroid/redroid:${{ github.event.inputs.android_version }}-latest" \
            --push \
            --tag "ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}" \
            -f Dockerfile .
            
