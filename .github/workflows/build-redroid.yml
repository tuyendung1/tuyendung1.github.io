name: Build Redroid Auto-IMEI Stable

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Nhập đúng định dạng: 11.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Tải mã nguồn của bro (chứa 2 file init.vphone.sh và vphone.rc)
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2. Clone công cụ redroid-script uy tín từ cộng đồng
      - name: Fetch Redroid Script Tools
        run: |
          sudo apt-get update && sudo apt-get install -y lzip
          git clone https://github.com/ayasa520/redroid-script.git builder
          
      # 3. Cài đặt trực tiếp thư viện Python bằng pip hệ thống
      - name: Install Python Dependencies Locally
        run: |
          sudo pip3 install requests tqdm

      # 4. Chạy script để tự động tải bản Redroid gốc và tự động vá Magisk vào bộ nhớ Local
      - name: Extract and Patch Magisk
        run: |
          cd builder
          python3 redroid.py -a ${{ github.event.inputs.android_version }} -m

      # 5. Di chuyển các file script vào thư mục và tạo file Dockerfile truyền thống
      - name: Generate Custom Dockerfile
        run: |
          mkdir -p workspace
          cp init.vphone.sh ./workspace/
          cp vphone.rc ./workspace/
          
          cat <<EOF > ./workspace/Dockerfile
          # Sử dụng Image gốc đã có Magisk nằm ngay trong bộ nhớ đệm Local của máy
          FROM redroid/redroid:${{ github.event.inputs.android_version }}_magisk

          # Nhúng các tập lệnh tự sinh IMEI và PIN vào hệ thống Android
          COPY init.vphone.sh /system/bin/init.vphone.sh
          COPY vphone.rc /vendor/etc/init/vphone.rc

          USER root
          RUN chmod 0755 /system/bin/init.vphone.sh
          EOF

      # 6. Đăng nhập tự động vào hệ thống GitHub Packages (GHCR) của bro
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Tiến hành Build lớp cuối bằng Docker gốc và Push thẳng lên GHCR
      - name: Compile and Push Custom Redroid Image
        run: |
          # Ép tên tài khoản viết thường để tránh lỗi Docker Registry hệ thống
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_TAG="ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}"
          
          cd workspace
          
          # Dùng lệnh docker build truyền thống để nhận diện được Image nền Local
          docker build -t "$TARGET_TAG" -f Dockerfile .
          
          # Đẩy Image hoàn chỉnh lên kệ Packages của bro
          docker push "$TARGET_TAG"
          
