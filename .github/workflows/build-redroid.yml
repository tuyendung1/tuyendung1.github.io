name: Build Redroid Auto-IMEI Stable

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Nhập đúng định dạng: 11.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Tải mã nguồn của bro (chứa 2 file init.vphone.sh và vphone.rc)
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2. Cài đặt Python và môi trường đóng gói phụ thuộc
      - name: Setup Python Environment
        run: |
          sudo pip3 install requests tqdm
        

      # 3. Clone công cụ redroid-script uy tín từ cộng đồng
      - name: Fetch Redroid Script Tools
        run: |
          sudo apt-get update && sudo apt-get install -y lzip
          git clone https://github.com/ayasa520/redroid-script.git builder

      # 4. Chạy script để tự động tải bản Redroid gốc và tự động vá Magisk
      - name: Extract and Patch Magisk
        run: |
          cd builder
          # Lệnh này tự kéo bản Android 11 gốc về và tự động tích hợp Magisk
          python3 redroid.py -a ${{ github.event.inputs.android_version }} -m
          
          # Giải nén Image vừa sinh ra tạm thời để chuẩn bị nhúng tiếp IMEI
          docker mknod /dev/loop0 b 7 0 || true
          mkdir -p ./root_dir
          docker save redroid/redroid:${{ github.event.inputs.android_version }}_magisk | tar -xC ./root_dir

      # 5. Nhúng các file tự sinh IMEI và thiết lập PIN vào lớp Android hoàn chỉnh
      - name: Inject Custom IMEI and PIN Scripts
        run: |
          # Di chuyển vào thư mục build tạm thời để tạo lớp Dockerfile bổ sung
          mkdir -p workspace
          cp init.vphone.sh ./workspace/
          cp vphone.rc ./workspace/
          
          cat <<EOF > ./workspace/Dockerfile
          # Lấy lớp nền chứa Magisk vừa được tạo ra ở bước trước
          FROM redroid/redroid:${{ github.event.inputs.android_version }}_magisk

          # Sao chép các tệp tin script cấu hình vào thẳng nhân Android
          COPY init.vphone.sh /system/bin/init.vphone.sh
          COPY vphone.rc /vendor/etc/init/vphone.rc

          USER root
          RUN chmod 0755 /system/bin/init.vphone.sh
          EOF

      # 6. Thiết lập hệ thống đóng gói Buildx chuyên sâu
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 7. Đăng nhập tự động vào hệ thống GitHub Packages (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Thực hiện Build lớp cuối và đẩy trực tiếp lên tài khoản cá nhân của bro
      - name: Compile and Push Custom Redroid Image
        run: |
          # Ép tên tài khoản viết thường để tránh lỗi Docker Registry hệ thống
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          cd workspace
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}" \
            -f Dockerfile .
            
