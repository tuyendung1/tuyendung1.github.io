name: Build Redroid Auto-IMEI Ultimate Full

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Nhập đúng định dạng: 11.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Tải mã nguồn của bro (chứa 2 file init.vphone.sh và vphone.rc ở thư mục gốc)
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2. Clone công cụ redroid-script uy tín từ cộng đồng để vá Magisk
      - name: Fetch Redroid Script Tools
        run: |
          sudo apt-get update && sudo apt-get install -y lzip
          git clone https://github.com/ayasa520/redroid-script.git builder

      # 3. Cài đặt trực tiếp thư viện Python bằng pip hệ thống
      - name: Install Python Dependencies Locally
        run: |
          sudo pip3 install requests tqdm

      # 4. Chạy script để tự động tải bản Redroid gốc từ Docker Hub và tự động vá Magisk
      - name: Extract and Patch Magisk
        run: |
          cd builder
          python3 redroid.py -a ${{ github.event.inputs.android_version }} -m

      # 5. Di chuyển các file script vào thư mục và tạo file Dockerfile SẠCH
      # Đã chuyển script từ phân vùng /system (bị khóa) sang /vendor (mở quyền ghi)
      - name: Generate Custom Dockerfile
        run: |
          mkdir -p workspace
          cp init.vphone.sh ./workspace/
          cp vphone.rc ./workspace/
          
          cat <<EOF > ./workspace/Dockerfile
          # Sử dụng Image gốc đã có Magisk nằm ngay trong bộ nhớ đệm Local của máy ảo
          FROM redroid/redroid:${{ github.event.inputs.android_version }}_magisk

          # Nhúng tập lệnh tự sinh IMEI/PIN vào phân vùng Vendor được phép ghi quyền
          COPY init.vphone.sh /vendor/bin/init.vphone.sh
          COPY vphone.rc /vendor/etc/init/vphone.rc

          # Thực hiện phân quyền cho thư mục Vendor (Không bao giờ bị dính lỗi exit code 255)
          RUN chmod 0755 /vendor/bin/init.vphone.sh
          EOF

      # 6. Đăng nhập tự động vào hệ thống lưu trữ GitHub Packages (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Tiến hành Build lớp cuối bằng lệnh Docker truyền thống và đẩy thẳng lên mạng
      - name: Compile and Push Custom Redroid Image
        run: |
          # Ép tên tài khoản viết thường để tránh lỗi Docker Registry hệ thống khi tài khoản có chữ hoa
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_TAG="ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}"
          
          cd workspace
          
          # Build đè lớp script IMEI/PIN lên Image nền Magisk có sẵn trong máy
          docker build -t "$TARGET_TAG" -f Dockerfile .
          
          # Đẩy Image hoàn chỉnh lên kệ Packages của bro
          docker push "$TARGET_TAG"
          
