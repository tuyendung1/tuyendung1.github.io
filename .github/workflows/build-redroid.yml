name: Build Redroid Clean Auto-IMEI

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Ví dụ: 11.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Tải mã nguồn từ kho lưu trữ của bro
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2. Tạo sẵn thư mục môi trường sạch
      - name: Create Clean Workspace
        run: |
          mkdir -p workspace
          cp init.vphone.sh ./workspace/
          cp vphone.rc ./workspace/

      # 3. Tạo trực tiếp file Dockerfile gốc tại thư mục sạch (Không dùng git clone ngoài)
      - name: Generate Inline Dockerfile
        run: |
          cat <<EOF > ./workspace/Dockerfile
          # Sử dụng Image nền gốc từ công cụ build sẵn Magisk/Zygisk của cộng đồng
          FROM ghcr.io/googway/redroid-magisk:${{ github.event.inputs.android_version }}

          # Nhúng trực tiếp tập lệnh tự sinh IMEI và thiết lập PIN vào phân vùng Android
          COPY init.vphone.sh /system/bin/init.vphone.sh
          COPY vphone.rc /vendor/etc/init/vphone.rc

          USER root
          RUN chmod 0755 /system/bin/init.vphone.sh
          EOF

      # 4. Thiết lập hệ thống đóng gói Docker Buildx mới nhất
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 5. Đăng nhập tự động vào GitHub Packages (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Tiến hành Build và tự động đẩy (Push) trực tiếp lên tài khoản của bro
      - name: Build and Push Image
        run: |
          # Ép tên tài khoản viết thường để tránh lỗi Docker Registry hệ thống
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          cd workspace
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}" \
            -f Dockerfile .
            
