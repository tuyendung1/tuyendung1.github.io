name: Build Redroid Auto-IMEI From Scratch

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Phiên bản Android (Ví dụ: 11.0.0)'
        required: true
        default: '11.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Tải mã nguồn từ kho lưu trữ của bro (chứa 2 file init.vphone.sh và vphone.rc)
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2. Clone công cụ chèn Magisk chính chủ từ cộng đồng về thư mục builder
      - name: Fetch Magisk Builder Tools
        run: |
          git clone https://github.com builder
          cp init.vphone.sh ./builder/
          cp vphone.rc ./builder/

      # 3. Chèn trực tiếp tập lệnh tự sinh IMEI và thiết lập PIN vào cuối Dockerfile gốc của họ
      - name: Inject IMEI and PIN Customizations
        run: |
          cd builder
          echo "" >> Dockerfile
          echo "COPY init.vphone.sh /system/bin/init.vphone.sh" >> Dockerfile
          echo "COPY vphone.rc /vendor/etc/init/vphone.rc" >> Dockerfile
          echo "USER root" >> Dockerfile
          echo "RUN chmod 0755 /system/bin/init.vphone.sh" >> Dockerfile

      # 4. Thiết lập hệ thống đóng gói chuyên sâu Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 5. Đăng nhập tự động vào hệ thống GitHub Packages (GHCR) của bro
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Tự động biên dịch từ bản Redroid gốc của Docker Hub thành bản tùy biến và đẩy lên GHCR
      - name: Compile and Push Image
        run: |
          cd builder
          # Chuyển đổi tên tài khoản thành chữ thường để hệ thống Docker Registry chấp nhận
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # Thực thi đóng gói tự động
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "IMAGE=redroid/redroid:${{ github.event.inputs.android_version }}-latest" \
            --push \
            --tag "ghcr.io/${REPO_OWNER}/redroid-auto-imei:${{ github.event.inputs.android_version }}" \
            -f Dockerfile .
            
